# bootc lint requires /var content created by RPM scriptlets to be declared in
# tmpfiles.d so it is re-created correctly on updates.
#
# The greeter's home is /var/lib/greeter, per dms-greeter's own sysusers.d.
# Masking xdg-desktop-portal for the greeter session must therefore land under
# that home and be owned by greeter: /var/lib/greetd belongs to the greetd
# daemon user and is reset recursively by greetd's own tmpfiles entry
# (Z /var/lib/greetd - greetd greetd - -), so greeter-owned content cannot live
# there.
d /var/lib/greeter/.config                    0755 greeter greeter -
d /var/lib/greeter/.config/systemd            0755 greeter greeter -
d /var/lib/greeter/.config/systemd/user       0755 greeter greeter -
L /var/lib/greeter/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
