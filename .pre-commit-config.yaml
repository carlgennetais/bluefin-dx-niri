# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
        - id: check-json
        - id: check-toml
        - id: check-yaml
        - id: end-of-file-fixer
        - id: trailing-whitespace

  - repo: local
    hooks:
      - id: validate-brewfiles
        name: Validate Brewfiles
        entry: bash -c 'if command -v brew &> /dev/null; then for file in system_files/usr/share/ublue-os/homebrew/*.Brewfile*; do [ -f "$file" ] || continue; brew bundle check --file="$file" || exit 1; done; else echo "⚠️  Homebrew not installed, skipping Brewfile validation"; fi'
        language: system
        files: '^system_files/usr/share/ublue-os/homebrew/.*\.Brewfile.*$'
        pass_filenames: false

      - id: shellcheck
        name: ShellCheck build scripts
        entry: bash -c 'if command -v shellcheck &> /dev/null; then shellcheck -x build_files/*.sh; else echo "⚠️  shellcheck not installed, skipping"; fi'
        language: system
        files: '^build_files/.*\.sh$'
        pass_filenames: false
